[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    HC_Errors_Count           5
    HC_Retry_Failure_Count     5
    HC_Period                 60
    storage.path              /state/buffer
    storage.sync              full
    storage.checksum          on
    storage.backlog.mem_limit  16M

[INPUT]
    Name              tail
    Tag               simulation.logs
    Path              /logs/*.jsonl
    Parser            normalized_json
    DB                /state/tail.db
    DB.Sync           Full
    Read_from_Head    On
    Refresh_Interval  1
    Rotate_Wait       10
    Buffer_Max_Size   1M
    Skip_Long_Lines   Off
    storage.type      filesystem

[OUTPUT]
    Name                      kafka
    Match                     simulation.logs
    Brokers                   kafka:9092
    Topics                    simulation.logs.raw.v1
    Format                    json
    Timestamp_Key             fluent_bit_time
    Retry_Limit               False
    queue_full_retries        0
    rdkafka.request.required.acks -1
    rdkafka.enable.idempotence true
    rdkafka.log.connection.close false
